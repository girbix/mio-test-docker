<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC - Dettaglio Change</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="dark-mode">
    <div class="header">
        <h1><i class="fas fa-exchange-alt"></i> Change Request <span id="changeNumber"></span></h1>
        <div class="red-line"></div>
        <div class="user-info">
            <span id="loggedUser"></span> | <a href="#" id="logoutLink"><i class="fas fa-sign-out-alt"></i> Logout</a> | <a href="tech.html"><i class="fas fa-chalkboard-user"></i> Dashboard</a>
        </div>
        <button id="themeToggle" class="theme-btn" aria-label="Cambia tema"><i class="fas fa-moon"></i></button>
    </div>

    <div class="container">
        <div class="tabs">
            <button class="tab-button active" data-tab="planning"><i class="fas fa-calendar-check"></i> Pianificazione</button>
            <button class="tab-button" data-tab="notes"><i class="fas fa-sticky-note"></i> Note Interne</button>
            <button class="tab-button" data-tab="closure"><i class="fas fa-check-double"></i> Chiusura</button>
        </div>
        <div id="planning" class="tab-content active">
            <form class="two-column">
                <div class="left-column">
                    <div class="form-group">
                        <label><i class="fas fa-hashtag"></i> Number</label>
                        <input type="text" id="number" readonly>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-calendar-alt"></i> Opened</label>
                        <input type="text" id="opened" readonly>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-user"></i> Requested by</label>
                        <input type="text" id="requestedBy" readonly>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-tasks"></i> Service offering</label>
                        <input type="text" id="serviceOffering">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-server"></i> Configuration item</label>
                        <input type="text" id="ci">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-heading"></i> Short description</label>
                        <input type="text" id="shortDescription">
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-align-left"></i> Description</label>
                        <textarea id="description" rows="3"></textarea>
                    </div>
                    <div class="form-group">
                        <label><i class="fas fa-chart-line"></i> Risk</label>
                        <select id="risk">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                </div>
                <div class="right-column">
                    <div class="form-group required">
                        <label for="justification"><i class="fas fa-comment-dots"></i> Giustificazione</label>
                        <textarea id="justification" rows="3" required></textarea>
                    </div>
                    <div class="form-group required">
                        <label for="implementationPlan"><i class="fas fa-tasks"></i> Piano di implementazione</label>
                        <textarea id="implementationPlan" rows="4" required></textarea>
                    </div>
                    <div class="form-group required">
                        <label for="riskAnalysis"><i class="fas fa-chart-line"></i> Analisi di rischio e impatto</label>
                        <textarea id="riskAnalysis" rows="4" required></textarea>
                    </div>
                </div>
            </form>
        </div>
        <div id="notes" class="tab-content">
            <h3><i class="fas fa-sticky-note"></i> Note Interne (Work Notes)</h3>
            <div class="form-group">
                <label for="workNotes">Note private (visibili solo ai tecnici)</label>
                <textarea id="workNotes" rows="6"></textarea>
            </div>
        </div>

        <div id="closure" class="tab-content">
            <h3><i class="fas fa-check-double"></i> Chiusura Ticket e RCA</h3>
            <form>
                <div class="form-group">
                    <label for="ticketGrade"><i class="fas fa-exclamation-triangle"></i> Grado ticket</label>
                    <select id="ticketGrade">
                        <option value="1">Grado 1 (Critico)</option>
                        <option value="2">Grado 2 (Alto)</option>
                        <option value="3">Grado 3 (Medio)</option>
                    </select>
                </div>
                <div class="form-group required" id="rcaGroup">
                    <label for="rca"><i class="fas fa-search"></i> Root Cause Analysis (RCA) <span id="rcaRequired" class="required-badge">Obbligatorio per Grado 1</span></label>
                    <textarea id="rca" rows="4"></textarea>
                </div>
            </form>
        </div>

        <div class="full-width">
            <button id="updateChangeBtn" class="btn-primary"><i class="fas fa-save"></i> Aggiorna Change</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="change-detail.js"></script>
    <script src="main.js"></script>
</body>
</html>
