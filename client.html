<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC - Portale Cliente</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="dark-mode">
    <div class="header">
        <h1><i class="fas fa-user-circle"></i> Portale Self-Service</h1>
        <div class="red-line"></div>
        <div class="user-info">
            <span id="loggedUser"></span> | <a href="#" id="logoutLink"><i class="fas fa-sign-out-alt"></i> Logout</a>
        </div>
        <button id="themeToggle" class="theme-btn" aria-label="Cambia tema"><i class="fas fa-moon"></i></button>
    </div>

    <div class="container">
        <div class="monitoring-section">
            <h2><i class="fas fa-chart-simple"></i> Monitoraggio Ticket</h2>
            <div class="stats-cards">
                <div class="stat-card">
                    <span class="stat-label"><i class="fas fa-inbox"></i> Aperti</span>
                    <span class="stat-value" id="openCount">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label"><i class="fas fa-spinner"></i> In lavorazione</span>
                    <span class="stat-value" id="inProgressCount">0</span>
                </div>
                <div class="stat-card">
                    <span class="stat-label"><i class="fas fa-check-circle"></i> Risolti</span>
                    <span class="stat-value" id="resolvedCount">0</span>
                </div>
            </div>
            <div class="progress-container">
                <label><i class="fas fa-chart-line"></i> Andamento generale</label>
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
                </div>
            </div>
        </div>

        <div class="tickets-section">
            <h3><i class="fas fa-ticket-alt"></i> I tuoi ticket</h3>
            <table class="ticket-table" id="clientTicketTable">
                <thead>
                    肇
                        <th>Numero</th>
                        <th>Tipo</th>
                        <th>Descrizione</th>
                        <th>Stato</th>
                        <th>Priorità</th>
                        <th>Aperto il</th>
                    </tr>
                </thead>
                <tbody id="clientTicketList"></tbody>
            </table>
        </div>

        <button id="newIncidentBtn" class="btn-primary"><i class="fas fa-plus-circle"></i> Nuovo Incident</button>

        <div id="incidentModal" class="modal">
            <div class="modal-content">
                <span class="close">&times;</span>
                <h2><i class="fas fa-bug"></i> Crea Nuovo Incident</h2>
                <form id="incidentForm" class="two-column">
                    <div class="left-column">
                        <div class="form-group required">
                            <label for="requestedBy"><i class="fas fa-user"></i> Requested by</label>
                            <input type="text" id="requestedBy" name="requestedBy" required readonly>
                        </div>
                        <div class="form-group required">
                            <label for="caller"><i class="fas fa-phone-alt"></i> Caller</label>
                            <input type="text" id="caller" name="caller" required>
                        </div>
                        <div class="form-group">
                            <label for="location"><i class="fas fa-map-marker-alt"></i> Location</label>
                            <input type="text" id="location" name="location" list="location-list">
                            <datalist id="location-list"></datalist>
                        </div>
                        <div class="form-group required">
                            <label for="service"><i class="fas fa-cogs"></i> Service</label>
                            <input type="text" id="service" name="service" list="service-list" required>
                            <datalist id="service-list"></datalist>
                        </div>
                        <div class="form-group">
                            <label for="serviceOffering"><i class="fas fa-tasks"></i> Service Offering</label>
                            <input type="text" id="serviceOffering" name="serviceOffering" list="offering-list">
                            <datalist id="offering-list"></datalist>
                        </div>
                        <div class="form-group">
                            <label for="ci"><i class="fas fa-server"></i> Configuration Item</label>
                            <input type="text" id="ci" name="ci" list="ci-list">
                            <datalist id="ci-list"></datalist>
                        </div>
                    </div>
                    <div class="right-column">
                        <div class="form-group required">
                            <label for="shortDescription"><i class="fas fa-heading"></i> Short description</label>
                            <input type="text" id="shortDescription" name="shortDescription" required>
                        </div>
                        <div class="form-group">
                            <label for="description"><i class="fas fa-align-left"></i> Description</label>
                            <textarea id="description" rows="3"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="internalNotes"><i class="fas fa-sticky-note"></i> Internal notes</label>
                            <textarea id="internalNotes" rows="2"></textarea>
                        </div>
                        <div class="form-group">
                            <label for="urgency"><i class="fas fa-exclamation-triangle"></i> Urgency</label>
                            <select id="urgency">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="impact"><i class="fas fa-chart-line"></i> Impact</label>
                            <select id="impact">
                                <option value="Low">Low</option>
                                <option value="Medium" selected>Medium</option>
                                <option value="High">High</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="contract"><i class="fas fa-file-contract"></i> Contract</label>
                            <input type="text" id="contract">
                        </div>
                    </div>
                    <div class="full-width">
                        <button type="submit" class="btn-primary"><i class="fas fa-paper-plane"></i> Crea Incident</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="client.js"></script>
    <script src="main.js"></script>
</body>
</html>
