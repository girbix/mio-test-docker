<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NOC - Dettaglio Incident</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body class="dark-mode">
    <div class="header">
        <h1><i class="fas fa-bug"></i> Incident <span id="incidentNumber"></span></h1>
        <div class="red-line"></div>
        <div class="user-info">
            <span id="loggedUser"></span> | <a href="#" id="logoutLink"><i class="fas fa-sign-out-alt"></i> Logout</a> | <a href="tech.html"><i class="fas fa-chalkboard-user"></i> Dashboard</a>
        </div>
        <button id="themeToggle" class="theme-btn" aria-label="Cambia tema"><i class="fas fa-moon"></i></button>
    </div>

    <div class="container two-column">
        <div class="left-column">
            <div class="form-group">
                <label><i class="fas fa-hashtag"></i> Number</label>
                <input type="text" id="number" readonly>
            </div>
            <div class="form-group">
                <label><i class="fas fa-calendar-alt"></i> Opened</label>
                <input type="text" id="opened" readonly>
            </div>
            <div class="form-group">
                <label><i class="fas fa-user"></i> Requested by</label>
                <input type="text" id="requestedBy" readonly>
            </div>
            <div class="form-group">
                <label><i class="fas fa-phone-alt"></i> Caller</label>
                <input type="text" id="caller" readonly>
            </div>
            <div class="form-group">
                <label><i class="fas fa-map-marker-alt"></i> Location</label>
                <input type="text" id="location" readonly>
            </div>
            <div class="form-group">
                <label><i class="fas fa-tasks"></i> Service offering</label>
                <input type="text" id="serviceOffering">
            </div>
            <div class="form-group">
                <label><i class="fas fa-server"></i> Configuration item</label>
                <input type="text" id="ci">
            </div>
            <div class="form-group">
                <label><i class="fas fa-heading"></i> Short description</label>
                <input type="text" id="shortDescription">
            </div>
            <div class="form-group">
                <label><i class="fas fa-align-left"></i> Description</label>
                <textarea id="description" rows="3"></textarea>
            </div>
            <div class="form-group">
                <label><i class="fas fa-sticky-note"></i> Internal notes</label>
                <textarea id="internalNotes" rows="3"></textarea>
            </div>
        </div>

        <div class="right-column">
            <div class="form-group">
                <label><i class="fas fa-rss"></i> Channel</label>
                <input type="text" id="channel" value="Self-Service" readonly>
            </div>
            <div class="form-group">
                <label><i class="fas fa-tag"></i> State</label>
                <select id="state">
                    <option value="New">New</option>
                    <option value="In Progress">In Progress</option>
                    <option value="Resolved">Resolved</option>
                    <option value="Closed">Closed</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-chart-line"></i> Impact</label>
                <select id="impact">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-exclamation-triangle"></i> Urgency</label>
                <select id="urgency">
                    <option value="Low">Low</option>
                    <option value="Medium">Medium</option>
                    <option value="High">High</option>
                </select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-chart-simple"></i> Priority</label>
                <input type="text" id="priority" readonly>
            </div>
            <div class="form-group">
                <label><i class="fas fa-level-up-alt"></i> Parent Incident</label>
                <input type="text" id="parentIncident" list="parent-list">
                <datalist id="parent-list"></datalist>
            </div>
            <div class="form-group">
                <label><i class="fas fa-users"></i> Assignment group</label>
                <select id="assignmentGroup"></select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-user-check"></i> Assigned to</label>
                <select id="assignedTo"></select>
            </div>
            <div class="form-group">
                <label><i class="fas fa-file-contract"></i> Contract</label>
                <input type="text" id="contract">
            </div>
        </div>

        <div class="full-width">
            <div class="suggestion-box">
                <div class="form-group">
                    <label><i class="fas fa-robot"></i> Team suggerito (AI)</label>
                    <input type="text" id="suggestedTeam" readonly class="suggested-team">
                </div>
                <div class="form-group">
                    <label><i class="fas fa-tasks"></i> Assegna a team</label>
                    <select id="assignedTeam">
                        <option value="">Seleziona team</option>
                        <option value="Network">Network</option>
                        <option value="Cloud">Cloud</option>
                        <option value="Cyber Security">Cyber Security</option>
                    </select>
                </div>
                <div class="client-history">
                    <h4><i class="fas fa-history"></i> Ticket precedenti del cliente</h4>
                    <ul id="clientHistory"></ul>
                </div>
            </div>
        </div>

        <div class="full-width">
            <button id="updateIncidentBtn" class="btn-primary"><i class="fas fa-save"></i> Aggiorna Incident</button>
        </div>
    </div>

    <script src="data.js"></script>
    <script src="utils.js"></script>
    <script src="incident-detail.js"></script>
    <script src="main.js"></script>
</body>
</html>
